<!DOCTYPE html>
<!--
  Карта для выбора точки прямо в Telegram (Mini App). Открывается кнопкой «🗺 Выбрать на карте»
  под полем ввода, возвращает боту {lat, lon, ctx} через Telegram.WebApp.sendData и закрывается.
  ctx — что отмечали (маршрут или группа), его бот кладёт в адрес страницы: ?ctx=…&lat=…&lon=…
  Геолокация не нужна: человек двигает карту под метку, ищет адрес или жмёт на нужное место.
  Нужен https-хостинг (например GitHub Pages), адрес — в MAP_URL в .env.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Birge — точка на карте</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #fff);
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font: 15px/1.35 -apple-system, system-ui, Roboto, "Segoe UI", sans-serif; color: var(--text); }
  #map { position: fixed; inset: 0; background: #e8e4dc; }

  /* Метка стоит в центре экрана, под ней двигается карта */
  .pin { position: fixed; left: 50%; top: 50%; z-index: 1000; pointer-events: none; }
  .pin::before {
    content: ""; position: absolute; left: -16px; top: -39px; width: 32px; height: 32px; box-sizing: border-box;
    background: #e53935; border: 3px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .35); transition: top .15s;
  }
  .pin::after {
    content: ""; position: absolute; left: -4px; top: -2px; width: 8px; height: 4px;
    background: rgba(0, 0, 0, .35); border-radius: 50%;
  }
  .pin.up::before { top: -49px; }

  .top { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1001; }
  form { display: flex; gap: 6px; }
  input {
    flex: 1; min-width: 0; padding: 11px 14px; font: inherit; color: var(--text); background: var(--bg);
    border: 0; border-radius: 12px; box-shadow: 0 1px 6px rgba(0, 0, 0, .2); outline: none; -webkit-appearance: none;
  }
  input::placeholder { color: var(--hint); }
  .results {
    margin-top: 6px; max-height: 55vh; overflow-y: auto; background: var(--bg); border-radius: 12px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, .2);
  }
  .results:empty { display: none; }
  .results button {
    display: block; width: 100%; padding: 10px 14px; font: inherit; text-align: left; color: var(--text);
    background: none; border: 0; border-top: 1px solid rgba(128, 128, 128, .15);
  }
  .results button:first-child { border-top: 0; }
  .results small { display: block; color: var(--hint); font-size: 13px; }
  .results .empty { padding: 10px 14px; color: var(--hint); }
  .results .more { color: var(--accent); }
  .hint {
    margin: 8px auto 0; width: fit-content; max-width: 100%; box-sizing: border-box; padding: 6px 12px;
    font-size: 13px; text-align: center; color: #fff;
    background: rgba(0, 0, 0, .6); border-radius: 14px; transition: opacity .4s;
  }
  .hint.gone { opacity: 0; }

  .locate {
    position: fixed; right: 12px; bottom: 28px; z-index: 1001; width: 48px; height: 48px; padding: 12px;
    color: var(--accent); background: var(--bg); border: 0; border-radius: 50%; box-shadow: 0 1px 6px rgba(0, 0, 0, .25);
  }
  .locate svg { display: block; width: 24px; height: 24px; }
  .toast {
    position: fixed; left: 12px; right: 72px; bottom: 90px; z-index: 1001; padding: 10px 14px; font-size: 14px;
    color: #fff; background: rgba(0, 0, 0, .75); border-radius: 12px;
  }
  /* Своя кнопка, а не MainButton Telegram: одинаково работает во всех приложениях */
  .pick {
    position: fixed; left: 12px; right: 72px; bottom: 28px; z-index: 1001; padding: 14px; font: inherit; font-weight: 600;
    color: var(--accent-text); background: var(--accent); border: 0; border-radius: 12px;
  }
  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-bottom.leaflet-right { right: auto; left: 0; }
</style>
</head>
<body>
<div id="map"></div>
<div class="pin" id="pin"></div>
<div class="top">
  <form id="search">
    <input id="q" type="search" enterkeyhint="search" placeholder="🔍 Улица, дом или место" autocomplete="off">
  </form>
  <div class="results" id="results"></div>
  <div class="hint" id="hint">Двигайте карту или нажмите на место</div>
</div>
<button class="locate" id="locate" aria-label="Где я">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/>
    <path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>
  </svg>
</button>
<div class="toast" id="toast" hidden></div>
<button class="pick" id="pick">Выбрать эту точку</button>

<script>
  // Город и посёлки — как AREAS в birge/routes.py (тест проверяет, что списки совпадают).
  // В OpenStreetMap их по названию не найти: «Заречный» там — рынок, «Нур-Сити» — магазин, «город» — Алга.
  const AREAS = [
    { title: "Актобе", at: [50.2839, 57.167], zoom: 12, stems: ["город", "актоб", "ақтөбе", "aktobe"] },
    { title: "Заречный", at: [50.2889, 57.2924], zoom: 14, stems: ["заречн"] },
    { title: "Нур-Сити", at: [50.3171, 57.3338], zoom: 14, stems: ["нур сити", "нурсити", "nur city"] },
    { title: "Каргалинское", at: [50.3144, 57.3092], zoom: 14, stems: ["каргалин", "қарғалы"] },
    { title: "Курайли", at: [50.457, 57.024], zoom: 14, stems: ["курайл", "құрайл"] },
    { title: "Сазды", at: [50.1707, 57.0758], zoom: 14, stems: ["сазд"] },
    { title: "Жанаконыс", at: [50.2918, 57.079], zoom: 14, stems: ["жанаконыс", "жаңақоныс"] },
    { title: "п. Новый", at: [50.2905, 57.0661], zoom: 14, stems: ["нов"] },
  ];
  const FILLER = new Set(["в", "во", "из", "на", "с", "со", "п", "пос", "поселок", "село", "аул", "мкр", "микрорайон",
                          "район", "г", "гор"]);
  const AKTOBE = AREAS[0].at;

  const tg = window.Telegram && Telegram.WebApp;
  // У карты с кнопки под полем ввода initData пустой — Telegram узнаём по платформе
  const inTelegram = Boolean(tg && tg.platform && tg.platform !== "unknown");
  const params = new URLSearchParams(location.search);
  const lat = parseFloat(params.get("lat")), lon = parseFloat(params.get("lon")), zoom = parseInt(params.get("z"), 10);
  const start = Number.isFinite(lat) && Number.isFinite(lon) ? [lat, lon] : null;
  const $ = id => document.getElementById(id);
  if (params.get("place")) $("hint").textContent = `📍 ${params.get("place")} — двигайте карту`;

  // Дальше ~60 км от Актобе бот точки не принимает — туда и не пускаем
  const bounds = L.latLng(AKTOBE).toBounds(130000);
  const map = L.map("map", { zoomControl: false, maxBounds: bounds, maxBoundsViscosity: 1, minZoom: 9 })
    .setView(start || AKTOBE, Number.isFinite(zoom) ? zoom : start ? 15 : 12);
  map.attributionControl.setPrefix(false);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  map.on("movestart", () => { $("pin").classList.add("up"); $("hint").classList.add("gone"); });
  map.on("moveend", () => $("pin").classList.remove("up"));
  map.on("click", e => map.panTo(e.latlng));

  let toastTimer;
  function toast(text, ms = 4000) {
    $("toast").textContent = text;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, ms);
  }

  // Место из поиска: пока метка на нём, боту уходит и название — попутчики увидят «НИШ», а не «точка на карте»
  let chosen = null;

  function pick() {
    const c = map.getCenter();
    const point = { lat: +c.lat.toFixed(6), lon: +c.lng.toFixed(6), ctx: params.get("ctx") || "" };
    if (chosen && c.distanceTo(chosen.at) < 50) point.label = chosen.title;
    const data = JSON.stringify(point);
    if (!inTelegram) {
      console.log("sendData", data);
      toast(data);
      return;
    }
    try {
      tg.sendData(data);  // Telegram закроет карту и пришлёт точку боту
    } catch (err) {
      console.warn(err);
    }
    // Карта всё ещё открыта — значит, этот Telegram точку не передал
    setTimeout(() => toast("Не получилось отправить точку 😕 Закройте карту и отправьте её через 📎 → Геопозиция " +
                           "или напишите адрес в чат.", 8000), 1500);
  }
  $("pick").onclick = pick;

  // «Где я» — по желанию: без доступа к геопозиции карта всё равно работает
  function locate() {
    const show = (la, lo) => map.setView([la, lo], 17);
    const fail = () => toast("Не получилось узнать, где вы. Подвиньте карту сами.");
    const lm = inTelegram && tg.isVersionAtLeast("8.0") && tg.LocationManager;
    if (lm) {
      const get = () => lm.isLocationAvailable ? lm.getLocation(d => d ? show(d.latitude, d.longitude) : fail()) : fail();
      lm.isInited ? get() : lm.init(get);
    } else if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(p => show(p.coords.latitude, p.coords.longitude), fail,
        { enableHighAccuracy: true, timeout: 10000 });
    } else {
      fail();
    }
  }
  $("locate").onclick = locate;

  // --- поиск ---
  // Пока печатают: город и посёлки, популярные места из списка ниже и Photon (OpenStreetMap для подсказок).
  // По Enter или «Искать везде» — ещё и Nominatim: он лучше знает русские названия, но подсказывать
  // на каждую букву через него нельзя по правилам OpenStreetMap.

  const words = text => text.toLowerCase().replace(/ё/g, "е").replace(/[^\p{L}\p{N}\s]/gu, " ")
    .split(/\s+/).filter(w => w && !FILLER.has(w));

  // Название целиком, с любым окончанием: «в Заречном», «город» — как area() в birge/routes.py
  const areaOf = ws => AREAS.find(a => a.stems.some(stem => {
    const parts = stem.split(" ");
    return ws.length === parts.length && ws.every((w, i) => w.startsWith(parts[i]));
  }));

  // Пока печатают: «зар» → Заречный
  function suggestions(ws) {
    const q = ws.join(" ");
    if (q.length < 2) return [];
    const exact = areaOf(ws);
    return AREAS.filter(a => a === exact || [...a.stems, words(a.title).join(" ")].some(s => s.startsWith(q)));
  }

  // Популярные места — по-русски и с сокращениями: в OpenStreetMap они по-казахски, «НИШ» там не найти.
  // keys — как ещё их пишут. Координаты — из OpenStreetMap.
  const PLACES = [
    { title: "НИШ — Назарбаев Интеллектуальная школа", sub: "Алтын Орда, 26Б", at: [50.277, 57.1312],
      keys: "nis назарбаев зияткерлік мектеп школа" },
    { title: "БИЛ — лицей «Білім-инновация»", sub: "ул. Каныша Сатпаева", at: [50.29193, 57.15066],
      keys: "ктл билим инновация лицей школа" },
    { title: "ТРЦ Keruen City", sub: "ул. Маншук Маметовой, 4", at: [50.28907, 57.19325],
      keys: "керуен кируен трц тц торговый центр mall" },
    { title: "ТРЦ Мега Шыгыс", sub: "ул. Кунаева, 208", at: [50.29721, 57.19829],
      keys: "mega мега шыгыс трц тц торговый центр" },
    { title: "ТРЦ Dalida Plaza", sub: "пр. Алии Молдагуловой, 74", at: [50.27424, 57.11358],
      keys: "далида плаза трц тц торговый центр" },
    { title: "ТЦ Айна", sub: "пр. Абилкайыр Хана, 42", at: [50.29886, 57.15436], keys: "aina тц торговый центр" },
    { title: "Ж/д вокзал", sub: "Привокзальная площадь", at: [50.28109, 57.21448],
      keys: "жд жэдэ вокзал поезд теміржол темиржол" },
    { title: "Автовокзал «Сапар»", sub: "пр. 312-й Стрелковой Дивизии, 4", at: [50.29363, 57.19917],
      keys: "автовокзал sapar" },
    { title: "Автовокзал «Экспресс»", sub: "пр. 312-й Стрелковой Дивизии, 9Ж", at: [50.29886, 57.18081],
      keys: "автовокзал express" },
    { title: "Аэропорт", sub: "им. Алии Молдагуловой", at: [50.24702, 57.20793], keys: "airport әуежай самолет" },
    { title: "Центральный рынок", sub: "ул. Т. Ахтанова", at: [50.27974, 57.23028], keys: "базар рынок" },
    { title: "АРУ — университет им. Жубанова", sub: "пр. Абилкайыр Хана", at: [50.29005, 57.15362],
      keys: "aru жубанов жубанова университет" },
    { title: "ЗКМУ — медуниверситет им. Оспанова", sub: "ул. Пацаева", at: [50.29757, 57.15017],
      keys: "мед медицинский медуниверситет оспанов университет" },
    { title: "Университет им. Баишева", sub: "8-й микрорайон", at: [50.28164, 57.16131], keys: "баишев университет" },
    { title: "БСМП — больница скорой помощи", sub: "ул. Пацаева, 7", at: [50.2982, 57.14749],
      keys: "больница скорая медицинская помощи" },
    { title: "Областная детская больница", sub: "пр. Едиге Батыра", at: [50.29248, 57.11385],
      keys: "одкб детская больница" },
    { title: "Перинатальный центр", sub: "пр. Едиге Батыра, 471В", at: [50.29385, 57.11381], keys: "роддом перинатальный" },
    { title: "ЦОН — Центр обслуживания населения", sub: "пр. Санкибай Батыра, 249", at: [50.2751, 57.17278],
      keys: "хкко хқко цон" },
    { title: "Мечеть «Нур Гасыр»", sub: "пр. Абилкайыр Хана, 92", at: [50.28178, 57.18908],
      keys: "мечеть мешіт нур гасыр nur" },
    { title: "Центральный парк", sub: "им. Первого Президента", at: [50.28744, 57.18654], keys: "парк саябақ" },
    { title: "Стадион «Кобыланды батыр»", sub: "пр. Абилкайыр Хана", at: [50.29153, 57.15909],
      keys: "стадион қобыланды кобыланды" },
    { title: "Жекпе-жек", sub: "дворец единоборств, ул. Ораз Татеулы, 5", at: [50.27624, 57.13892],
      keys: "жекпе жек единоборств" },
  ].map(p => ({ ...p, words: words(`${p.title} ${p.keys}`) }));

  // Каждое слово запроса — начало какого-нибудь слова места: «ниш», «назарб инт», «трц»
  const placesFor = ws => ws.length ? PLACES.filter(p => ws.every(w => p.words.some(k => k.startsWith(w)))) : [];

  const KINDS = {
    school: "школа", kindergarten: "детсад", university: "университет", college: "колледж", bus_stop: "остановка",
    mall: "ТЦ", supermarket: "супермаркет", convenience: "магазин", marketplace: "рынок", hospital: "больница",
    clinic: "поликлиника", pharmacy: "аптека", restaurant: "ресторан", cafe: "кафе", fuel: "заправка",
    place_of_worship: "мечеть / храм", park: "парк", stadium: "стадион", hotel: "гостиница",
    residential: "улица", primary: "улица", secondary: "улица", tertiary: "улица", living_street: "улица",
    unclassified: "улица", suburb: "район", neighbourhood: "район", quarter: "район",
  };
  const near = (la, lo) => L.latLng(AKTOBE).distanceTo([la, lo]) < 35000;  // Алга и Мартук — не наши

  // Подсказки Photon: первые на карте — ближе к тому, что сейчас на экране
  let photonAbort;
  async function photon(q) {
    photonAbort?.abort();
    photonAbort = new AbortController();
    const c = map.getCenter();
    const url = "https://photon.komoot.io/api/?" + new URLSearchParams({
      q, limit: "10", lat: c.lat.toFixed(4), lon: c.lng.toFixed(4), lang: "default",  // русского нет, иначе — английский
      bbox: [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()].join(","),
    });
    const res = await (await fetch(url, { signal: photonAbort.signal })).json();
    return res.features.map(f => {
      const p = f.properties, [lo, la] = f.geometry.coordinates;
      const street = [p.street, p.housenumber].filter(Boolean).join(", ");
      const title = p.name || street;
      const where = [KINDS[p.osm_value], p.name ? street : "", p.district || p.locality || p.city]
        .filter(Boolean).join(" · ");
      return { title, sub: where, at: [la, lo] };
    }).filter(r => r.title && near(...r.at));
  }

  async function nominatim(q) {
    const url = "https://nominatim.openstreetmap.org/search?" + new URLSearchParams({
      q, format: "jsonv2", limit: "8", "accept-language": "ru", bounded: "1",
      viewbox: [bounds.getWest(), bounds.getNorth(), bounds.getEast(), bounds.getSouth()].join(","),
    });
    return (await (await fetch(url)).json()).map(place => {
      const parts = place.display_name.split(", ");
      const title = place.name || parts[0];
      return { title, sub: parts.filter(p => p !== title).slice(0, 3).join(", "), at: [+place.lat, +place.lon] };
    });
  }

  function goTo(area) {
    $("results").replaceChildren();
    $("q").value = area.title;
    $("q").blur();
    chosen = null;
    map.setView(area.at, area.zoom);
  }

  function goToPlace(place) {
    $("results").replaceChildren();
    $("q").value = place.title;
    $("q").blur();
    chosen = place;
    map.once("moveend", () => {  // до setView: без анимации карта двигается сразу
      $("hint").textContent = `📍 ${place.title}`;
      $("hint").classList.remove("gone");
    });
    map.setView(place.at, 17);
  }

  function item(title, sub, onclick, className = "") {
    const button = document.createElement("button");
    button.className = className;
    button.textContent = title;
    if (sub) {
      const small = document.createElement("small");
      small.textContent = sub;
      button.append(small);
    }
    button.onclick = onclick;
    return button;
  }

  // Список под поиском: посёлки, популярные места, найденное (без повторов) и «Искать везде»
  function render(q, found = [], { searched = false } = {}) {
    const ws = words(q);
    const list = $("results");
    const areas = suggestions(ws);
    const places = placesFor(ws);
    const seen = new Set(places.map(p => p.title.toLowerCase()));
    const rest = found.filter(r => {
      const key = `${r.title}|${r.sub}`.toLowerCase();
      if (seen.has(key) || seen.has(r.title.toLowerCase())) return false;
      seen.add(key);
      return true;
    }).slice(0, 8);
    list.replaceChildren(
      ...areas.map(a => item(a.title, a === AREAS[0] ? "город" : "посёлок", () => goTo(a))),
      ...places.map(p => item(p.title, p.sub, () => goToPlace(p))),
      ...rest.map(r => item(r.title, r.sub, () => goToPlace(r))),
    );
    if (!q.trim()) return;
    if (!searched) {
      list.append(item(`🔍 Искать «${q.trim()}» везде`, "", () => searchAll(q), "more"));
    } else if (!list.children.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Ничего не нашли. Подвиньте карту сами.";
      list.append(empty);
    }
  }

  let typingTimer;
  $("q").addEventListener("input", () => {
    const q = $("q").value;
    render(q);
    clearTimeout(typingTimer);
    if (q.trim().length < 3) return;
    typingTimer = setTimeout(async () => {
      try {
        const found = await photon(q.trim());
        if ($("q").value === q) render(q, found);
      } catch (err) {
        if (err.name !== "AbortError") console.warn(err);
      }
    }, 300);
  });

  async function searchAll(q) {
    clearTimeout(typingTimer);
    photonAbort?.abort();
    $("q").blur();
    let found = [];
    try {
      found = await nominatim(q.trim());
    } catch (err) {
      console.warn(err);
    }
    if ($("q").value === q) render(q, found, { searched: true });
  }

  $("search").onsubmit = e => {
    e.preventDefault();
    const q = $("q").value;
    const area = areaOf(words(q));
    if (area) return goTo(area);  // написали «Заречный» — сразу туда
    if (q.trim()) searchAll(q);
  };

  if (inTelegram) {
    tg.ready();
    tg.expand();
    if (tg.isVersionAtLeast("7.7")) tg.disableVerticalSwipes();  // иначе карту не подвинуть вниз — окно закрывается
  }
</script>
</body>
</html>
